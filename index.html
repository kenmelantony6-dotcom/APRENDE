<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>APRENDE+</title>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="brand">APRENDE<span>+</span></div>
      <div id="subtitle">Aprende, practica y mejora</div>
    </div>
    <button class="icon-btn" onclick="showScreen('home')" aria-label="Inicio">⌂</button>
  </header>

  <main>
    <section id="welcome" class="screen active">
      <div class="hero-card">
        <div class="emoji">📚</div>
        <h1>¡Bienvenido a APRENDE+!</h1>
        <p>Una forma divertida de practicar tus materias escolares.</p>
        <input id="nameInput" maxlength="30" placeholder="Escribe tu nombre">
        <button class="primary" onclick="startApp()">Comenzar</button>
      </div>
    </section>

    <section id="home" class="screen">
      <div class="hello">
        <h2>Hola, <span id="studentName"></span> 👋</h2>
        <p>¿Qué quieres practicar hoy?</p>
      </div>
      <div id="subjects" class="grid"></div>
      <div class="motivation">⭐ ¡Tú puedes! Cada pregunta es una oportunidad para aprender.</div>
    </section>

    <section id="levels" class="screen">
      <button class="back" onclick="showScreen('home')">← Volver</button>
      <h2 id="levelTitle"></h2>
      <p>Elige tu nivel</p>
      <div class="levels">
        <button class="level easy" onclick="startQuiz('facil')"><b>🟢 Fácil</b><small>5 preguntas · 10 puntos</small></button>
        <button class="level medium" onclick="startQuiz('medio')"><b>🟡 Medio</b><small>7 preguntas · 15 puntos</small></button>
        <button class="level hard" onclick="startQuiz('dificil')"><b>🔴 Difícil</b><small>10 preguntas · 20 puntos</small></button>
      </div>
    </section>

    <section id="quiz" class="screen">
      <div class="quiz-head">
        <button class="back" onclick="showScreen('levels')">← Salir</button>
        <span id="scoreLabel">Puntos: 0</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <p id="questionCount"></p>
      <div class="question-card">
        <h2 id="questionText"></h2>
        <div id="answers"></div>
      </div>
      <div class="quiz-actions">
        <button id="nextBtn" class="primary" onclick="nextQuestion()" disabled>Siguiente →</button>
      </div>
    </section>

    <section id="results" class="screen">
      <div class="result-card">
        <div class="trophy">🏆</div>
        <h1>¡Felicidades!</h1>
        <p id="resultName"></p>
        <div class="stats">
          <div><b id="correctStat">0</b><small>Correctas</small></div>
          <div><b id="wrongStat">0</b><small>Errores</small></div>
          <div><b id="pointsStat">0</b><small>Puntos</small></div>
        </div>
        <p id="resultMessage"></p>
        <button class="primary" onclick="showScreen('home')">Volver al inicio</button>
        <button class="secondary" onclick="restartQuiz()">Jugar de nuevo</button>
      </div>
    </section>
  </main>

  <nav id="nav" class="bottom-nav hidden">
    <button onclick="showScreen('home')">⌂<span>Inicio</span></button>
    <button onclick="showProgress()">📈<span>Progreso</span></button>
    <button onclick="showAchievements()">🏅<span>Logros</span></button>
    <button onclick="showProfile()">👤<span>Perfil</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
